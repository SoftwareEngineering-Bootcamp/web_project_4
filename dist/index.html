<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="First Project With JS"><meta name="keywords" content="HTML5, CSS, JS"><meta name="author" content="Abravi Emiline Tekpa"><title>Around The U.S.</title><link href="main.css" rel="stylesheet"></head><body class="body"><header class="header"><img src="c75819857ff1599f0c50e9fc06373cd9.svg" alt="header-logo" class="logo"></header><main class="content"><section class="profile"><div class="profile__avatar"><img src="fe6c4f9454995a436f2e897e6cd99d9e.png" alt="profile-pic" class="profile__photo"><div class="profile__info"><div class="profile__title"><h1 class="profile__name">Jacques Cousteau</h1><button type="button" aria-label="edit-profile" class="profile__edit"></button></div><p class="profile__description">Explorer</p></div></div><button aria-label="add-card-button" class="add-button"></button></section><section class="elements"><ul class="elements__list"></ul></section></main><footer class="footer"><p class="footer__item">© 2020 Around The U.S.</p></footer><div class="popup popup_type_edit-profile"><form name="profile" class="form form_edit-profile popup__form"><h2 class="form__title">Edit Profile</h2><fieldset class="form__field"><input id="profile-name" name="name" class="form__input form__input_type_name" placeholder="Name" minlength="2" maxlength="40" required> <span id="profile-name-error" class="form__field form__field_error"></span> <input id="profile-description" name="description" class="form__input form__input_type_description" placeholder="About Me" minlength="2" maxlength="200" required> <span id="profile-description-error" class="form__field form__field_error"></span></fieldset><button type="submit" aria-label="save-profile-edit" class="form__submit">Save</button> <button type="button" aria-label="close-edit-profile" class="popup__close form__close-button"></button></form></div><div class="popup popup_type_add-card"><form name="add" class="form form_add-card popup__form"><h2 class="form__title">New place</h2><fieldset class="form__field"><input id="card-title" name="title" class="form__input form__input_type_card-title" placeholder="Title" minlength="2" maxlength="30" required> <span id="card-title-error" class="form__field form__field_error"></span> <input id="card-url" type="url" name="imageLink" class="form__input form__input_type_card-url" placeholder="Image link" required> <span id="card-url-error" class="form__field form__field_error"></span></fieldset><button type="submit" aria-label="save-add-card" class="form__submit form__submit_disabled">Create</button> <button type="button" aria-label="close-add-card" class="popup__close form__close-button"></button></form></div><div class="popup popup_type_image"><div class="popup__content"><button type="button" aria-label="close-expand-card" class="popup__close"></button><figure class="popup__figure"><img class="popup__image" src="#" alt="#"><figcaption class="popup__image-caption"></figcaption></figure></div></div><template class="element"><li class="element__item"><button type="button" aria-label="delete-card" class="element__delete"></button> <img class="element__photo" src="#" alt="#"><div class="element__details"><h2 class="element__name"></h2><button type="button" aria-label="like-card" class="element__like"></button></div></li></template><script src="main.js"></script></body></html>
