<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="First Project With JS">
    <meta name="keywords" content="HTML5, CSS, JS">
    <meta name="author" content="Abravi Emiline Tekpa">
    <title>Around The U.S.</title>
    <link rel="stylesheet" href="./page/index.css">
  </head>

  <body class="body">
    <header class="header">
      <img src="./images/header_logo.svg" alt="header-logo" class="logo">
    </header>
    <main class="content">
      <section class="profile">
        <div class="profile__avatar">
          <img src="./images/profile_avatar.png" alt="profile-pic" class="profile__photo">
          <div class="profile__info">
            <div class="profile__title">
              <h1 class="profile__name">Jacques Cousteau</h1>
              <button type="button" class="profile__edit"></button>
            </div>
            <p class="profile__description">Explorer</p>
          </div>
        </div>
        <button class="add-button"></button>
      </section>

      <section class="elements">
        <ul class="elements__list"></ul>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__item">© 2020 Around The U.S.</p>
    </footer>

    <!-- overlay form pop up for user to update profile section -->
    <div class="popup popup_type_edit-profile">
      <form name="profile-edit-form" class="popup__form form">
        <h2 class="form__title">Edit Profile</h2>
        <fieldset class="form__field">
          <input type="text" name="profile-name" class="form__input form__input_type_name" placeholder="Name" required>
          <input type="text" name="profile-description" class="form__input form__input_type_description" placeholder="About Me" required>
        </fieldset>
        <button type="submit" class="form__submit">Save</button>
        <button type="button" class="form__close-button"></button>
      </form>
    </div>

    <!-- overlay form pop up for user to add a card -->
    <div class="popup popup_type_add-card">
      <form name="profile-edit-form" class="popup__form form">
        <h2 class="form__title">New place</h2>
        <fieldset class="form__field">
          <input type="text" name="card-title" class="form__input form__input_type_card-title" placeholder="Title" required>
          <input type="url" name="image-link" class="form__input form__input_type_card-url" placeholder="Image link" required>
        </fieldset>
        <button type="submit" class="form__submit form__submit_add-card">Create</button>
        <button type="button" class="form__close-button"></button>
      </form>
    </div>

    <!-- overlay form pop up to show image on click -->
    <div class="popup popup_type_image">
      <div class="popup__content">
        <button type="button" class="popup__close"></button>
        <figure name="image-popup" class="popup__figure">
          <img src="" alt="" class="popup__image">
          <figcaption class="popup__image-caption"></figcaption>
        </figure>
      </div>
    </div>

    <!-- template to add card to the page-->
    <template class="element">
      <li class="element__item">
        <button type="button" class="element__delete"></button>
        <div class="element__photo"></div>
        <div class="element__details">
          <h2 class="element__name"></h2>
          <button type="button" class="element__like"></button>
        </div>
      </li>
    </template>

    <script src="./script/index.js"></script>
  </body>
</html>
