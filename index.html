<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="First Project With JS">
    <meta name="keywords" content="HTML5, CSS, JS">
    <meta name="author" content="Abravi Emiline Tekpa">
    <title>Around The U.S.</title>
    <link rel="stylesheet" href="./page/index.css">
  </head>

  <body class="body">
    <header class="header">
      <img src="./images/header_logo.svg" alt="header-logo" class="logo">
    </header>
    <main class="content">
      <section class="profile">
        <div class="profile__avatar">
          <img src="./images/profile_avatar.png" alt="profile-pic" class="profile__photo">
          <div class="profile__info">
            <div class="profile__info_title">
              <h1 class="profile__name">Jacques Cousteau</h1>
              <button type="button" class="profile__edit"></button>
            </div>
            <p class="profile__description">Explorer</p>
          </div>
        </div>
        <button class="add-button"></button>
      </section>

      <section class="elements">
        <ul class="elements__list">
          <li class="element">
            <img src="./images/element_yosemite.png" alt="yosemite" class="element__photo">
            <div class="element__details">
              <h2 class="element__name">Yosemite Valley</h2>
              <button class="element__like"></button>
            </div>
          </li>
          <li class="element">
            <img src="./images/element_lake-louise.png" alt="lake" class="element__photo">
            <div class="element__details">
              <h2 class="element__name">Lake Louise</h2>
              <button class="element__like"></button>
            </div>
          </li>
          <li class="element">
            <img src="./images/element_bald-mountains.png" alt="bald-mountains" class="element__photo">
            <div class="element__details">
              <h2 class="element__name">Bald Mountains</h2>
              <button class="element__like"></button>
            </div>
          </li>
          <li class="element">
            <img src="./images/element_latemar.png" alt="latemar" class="element__photo">
            <div class="element__details">
              <h2 class="element__name">Latemar</h2>
              <button class="element__like"></button>
            </div>
          </li>
          <li class="element">
            <img src="./images/element_vanoise.png" alt="vanoise" class="element__photo">
            <div class="element__details">
              <h2 class="element__name">Vanoise National Park</h2>
              <button class="element__like"></button>
            </div>
          </li>
          <li class="element">
            <img src="./images/element_lago-di-braies.png" alt="lago-di-braies" class="element__photo">
            <div class="element__details">
              <h2 class="element__name">Lago di Braies</h2>
              <button class="element__like"></button>
            </div>
          </li>
        </ul>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__item">© 2020 Around The U.S.</p>
    </footer>
    <div class="popup">
      <form name="profile-edit-form" class="popup__form form">
        <h2 class="form__title">Edit Profile</h2>
        <fieldset class="form__field">
          <input type="text" name="profile-name" class="form__input form__input_type_name" placeholder="Name" required>
          <input type="text" name="profile-description" class="form__input form__input_type_description" placeholder="About Me" required>
        </fieldset>
        <button type="submit" class="form__submit">Save</button>
        <button type="button" class="form__close-button"></button>
      </form>
    </div>
    <script src="./script/index.js"></script>
  </body>
</html>
